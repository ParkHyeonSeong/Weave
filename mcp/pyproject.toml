[project]
name = "weave-mcp"
version = "0.1.0"
description = "MCP server exposing Weave project-management tools to Claude sessions"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.3,<4",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[project.scripts]
weave-mcp = "weave_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weave_mcp"]
