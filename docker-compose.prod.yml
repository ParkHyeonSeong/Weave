env_file:
  - .env.production

services:
  # -- Backend (FastAPI) ---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weave-backend
    expose:
      - "${BACKEND_PORT:-8000}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALLOWED_ORIGINS=https://${DOMAIN}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      - DEBUG=${DEBUG:-false}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "${BACKEND_PORT:-8000}", "--workers", "2"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8000}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - weave-network

  # -- Frontend (Next.js) --------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weave-frontend
    expose:
      - "${FRONTEND_PORT:-3000}"
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}
      - PORT=${FRONTEND_PORT:-3000}
    command: ["sh", "-c", "npm run build && npm start -- -p ${FRONTEND_PORT:-3000}"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - weave-network

  # -- Database (PostgreSQL) -----------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: weave-db
    # No external port exposure for security
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-weave}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-weave}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weave} -d ${POSTGRES_DB:-weave}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - weave-network

  # -- Nginx (Reverse Proxy + SSL) -----------------------------------------
  nginx:
    image: nginx:alpine
    container_name: weave-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - weave-network

  # -- Certbot (SSL certificate management) --------------------------------
  certbot:
    image: certbot/certbot
    container_name: weave-certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - weave-network

volumes:
  postgres-data:
  certbot-webroot:
  certbot-certs:

networks:
  weave-network:
    driver: bridge
