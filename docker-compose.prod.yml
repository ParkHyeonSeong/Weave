services:
  # -- Nginx (reverse proxy) ------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: weave-nginx
    ports:
      - "${EXPOSE_PORT:-13000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      weave-network:
        # 고정 IP로 고정해 backend가 nginx만 신뢰 프록시로 인정하게 한다(CFG-01).
        ipv4_address: 172.28.0.2

  # -- Backend (FastAPI) ---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weave-backend
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # nginx(고정 IP)만 신뢰 프록시로 인정 → 내부 호스트의 X-Real-IP 위조로 레이트리밋을
      # 우회하지 못하게 한다(CFG-01). 다른 토폴로지면 nginx IP로 맞춰 조정.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.28.0.2/32}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      - DEBUG=${DEBUG:-false}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@weave.local}
      - ENCRYPT_KEY=${ENCRYPT_KEY}
    volumes:
      - backend-uploads:/app/uploads
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - weave-network

  # -- Frontend (Next.js) --------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: weave-frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - weave-network

  # -- Database (PostgreSQL) -----------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: weave-db
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-weave}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-weave}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weave} -d ${POSTGRES_DB:-weave}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - weave-network

volumes:
  postgres-data:
  backend-uploads:

networks:
  weave-network:
    driver: bridge
    # 고정 subnet — nginx에 정적 IP(172.28.0.2)를 부여해 backend의 신뢰 프록시 목록을
    # 그 IP/32로 좁힐 수 있게 한다(CFG-01).
    ipam:
      config:
        - subnet: 172.28.0.0/16
