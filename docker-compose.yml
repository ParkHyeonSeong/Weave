# ⚠️ 개발 전용 compose입니다. DEBUG=true로 동작하며 backend 포트를 호스트에 노출하고,
#    CORS는 명시 ALLOWED_ORIGINS가 없으면 루프백(localhost/127.0.0.1) 임의 포트를 허용합니다.
#    프로덕션 배포에는 반드시 docker-compose.prod.yml(nginx 프록시·DEBUG=false·ALLOWED_ORIGINS)
#    을 사용하세요. 이 파일을 그대로 운영에 쓰면 안 됩니다.
services:
  # -- Backend (FastAPI) ---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weave-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
    environment:
      - DATABASE_URL=postgresql+asyncpg://weave:weave@db:5432/weave
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - LOG_LEVEL=DEBUG
      - DEBUG=true
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@weave.local}
      - ENCRYPT_KEY=${ENCRYPT_KEY:-dev-encrypt-key-do-not-use-in-prod}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - weave-network

  # -- Frontend (Next.js) --------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weave-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      # 단일 소스 parity 픽스처(backend/tests/fixtures)를 프론트 vitest가 컨테이너 안에서
      # 읽을 수 있게 read-only 마운트. JS parity 테스트가 ../../backend/... 경로로 로드.
      - ./backend/tests/fixtures:/backend/tests/fixtures:ro
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-8000}
      - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - weave-network

  # -- Database (PostgreSQL) -----------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: weave-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=weave
      - POSTGRES_PASSWORD=weave
      - POSTGRES_DB=weave
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave -d weave"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - weave-network

volumes:
  postgres-data:
  backend-venv:

networks:
  weave-network:
    driver: bridge
