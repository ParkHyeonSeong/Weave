upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' wss:; font-src 'self' data:; object-src 'none'; base-uri 'self';" always;

    # Backend API (/api/*)
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for: 클라이언트가 보낸 XFF를 그대로 통과시키지 않고
        # 실제 피어($remote_addr)를 가장 오른쪽에 덧붙인다 — 헤더 위조로 IP를 사칭하지
        # 못하게 한다(CFG-01). 백엔드는 신뢰 프록시 뒤에서만 이 값을 신뢰한다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (채팅, 캔버스 협업)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend (나머지 전부)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for: 클라이언트가 보낸 XFF를 그대로 통과시키지 않고
        # 실제 피어($remote_addr)를 가장 오른쪽에 덧붙인다 — 헤더 위조로 IP를 사칭하지
        # 못하게 한다(CFG-01). 백엔드는 신뢰 프록시 뒤에서만 이 값을 신뢰한다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
